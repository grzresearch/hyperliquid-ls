name: Bot und Seite

# Alle 15 Minuten eine Runde des Paper-Bots, danach wird die Seite mit seinem Stand neu veröffentlicht.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      screener:
        description: "Screener jetzt laufen lassen"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  # Der Bot läuft mit einem Token, das nur lesen darf; veröffentlicht wird in einem eigenen Job.
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Stand des Paper-Kontos holen
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bot-

      - name: Bot-Runde
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_URL: ${{ steps.pages.outputs.base_url }}/data
          SCREENER: ${{ github.event.inputs.screener == 'true' && 'now' || 'auto' }}
        run: |
          python3 -m bot --config bot.paper.toml --once --state-dir state --site site/data \
            --restore "$DATA_URL" --screener "$SCREENER"

      - name: Stand merken
        if: always() && hashFiles('state/paper.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: bot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seite zusammenstellen
        run: cp index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: bot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pausiert Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Commit; das hält ihn aktiv.
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" || true
