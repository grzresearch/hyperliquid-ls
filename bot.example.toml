# Vorlage für einen eigenen Lauf des Bots. Kopieren nach bot.toml und anpassen; bot.toml ist in .gitignore.
# Was hier fehlt, nimmt der Bot aus seinen Standardwerten (bot/__main__.py, DEFAULTS).

mode = "paper"            # paper | testnet | mainnet
start_equity = 10000      # nur paper: Startkapital in USDC
book_per_side = 1.5       # Long-Book = 1,5 × Kontowert; die Short-Seite wird beta-neutral dazu bemessen

[strategy]
window_days = 90          # Fenster für Betas, Kovarianz und VaR
eth_share = 40            # Anteil des Hedges in ETH in %, der Rest gleich verteilt im Alt-Korb
alts = ["SUI", "AVAX", "ADA", "TAO", "XPL", "MORPHO"]

# Feste Longs statt Screener: [screener] enabled = false setzen und hier Gewichte eintragen (beliebige Einheit).
# [strategy.weights]
# AAVE = 1
# ENA = 1

[screener]                # wählt die Longs, einmal am Tag
enabled = true
every_hours = 24
n_longs = 7
buffer = 3                # ein gehaltener Long bleibt, solange er unter den besten n_longs + buffer liegt
min_volume_usd = 2000000  # 24h-Volumen auf Hyperliquid
min_mcap_usd = 30000000
max_cost_bps = 25         # simulierte Kosten einer Testorder von 2.500 $ (Implementation Shortfall)
max_weight = 0.25
min_weight = 0.05
exclude = ["BTC", "ETH", "HYPE"]

[screener.factors]        # Gewichte im Gesamtscore
fee_growth = 0.12
revenue_growth = 0.10
volume_growth = 0.08
acceleration = 0.05
fee_yield = 0.10
holder_yield = 0.05
momentum = 0.20
catalysts = 0.10
funding = 0.10
liquidity = 0.10

[rebalancing]
risk_aversion = 3         # höher = engere Zone ohne Trades, öfter handeln
min_order_usd = 25
loop_seconds = 60         # ohne --once: so oft prüft er

[execution]
maker_wait_seconds = 90   # so lange als Maker (Post-Only), danach IOC
requote_seconds = 10      # so oft wird der Maker-Preis nachgezogen
max_slippage = 0.005      # Preisgrenze der IOC-Orders: 0,5 % über Ask bzw. unter Bid
taker_share = 0.3         # erwarteter Taker-Anteil für die Kostensimulation
maker_fee = 0.00015       # Hyperliquid Basisstufe
taker_fee = 0.00045
beta_tolerance = 0.25     # Netto-Beta beim Ausführen als Anteil am Long-Book, ab dem die Gegenseite sofort nachzieht
max_margin_use = 0.8      # höchstens so viel des Kontowerts als Initial Margin binden

[leverage]                # Cross-Margin, gedeckelt auf das Maximum von Hyperliquid
long = 5
short = 5
eth = 10

[account]                 # nur testnet/mainnet
address = ""              # öffentliche 0x-Adresse des Kontos
# Den Schlüssel der API-Wallet liest der Bot aus der Umgebungsvariable HL_API_KEY, nie aus dieser Datei.
